<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="45%" stop-color="#E51E2B" />
      <stop offset="100%" stop-color="#B80D18" />
    </linearGradient>
    <linearGradient id="softGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E51E2B" flood-opacity="0.25" />
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background is transparent/clean -->
  <g transform="translate(0, 0)">
    <!-- Main P Graphic with Pixels -->
    <g filter="url(#subtleDrop)">
      <!-- Upper P Loop Arch -->
      <path d="M 195 70 
               L 330 70 
               C 385 70, 420 105, 420 160 
               C 420 215, 385 250, 330 250 
               L 260 250 
               C 250 250, 242 258, 242 268 
               L 242 300 
               L 195 300 
               L 195 70 Z" 
            fill="url(#redGrad)" />
      
      <!-- Inner Loop Cutout / Arch styling -->
      <path d="M 242 122 
               L 322 122 
               C 348 122, 368 138, 368 160 
               C 368 182, 348 198, 322 198 
               L 242 198 Z" 
               fill="#FFFFFF" />

      <!-- Left Top Red Pixel Tile -->
      <rect x="120" y="115" width="56" height="56" rx="10" fill="url(#redGrad)" filter="url(#tileShadow)" />
      <!-- Inner soft highlight -->
      <rect x="122" y="117" width="52" height="26" rx="8" fill="url(#softGlow)" />

      <!-- Left Middle White Pixel Tile -->
      <rect x="168" y="165" width="56" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#tileShadow)" />

      <!-- Left Lower Red Pixel Tile -->
      <rect x="185" y="240" width="58" height="58" rx="10" fill="url(#redGrad)" filter="url(#tileShadow)" />
      <rect x="187" y="242" width="54" height="26" rx="8" fill="url(#softGlow)" />
    </g>

    <!-- Wordmark: PIXELO. -->
    <g transform="translate(250, 385)" text-anchor="middle">
      <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="64" fill="#111827" letter-spacing="4">
        P I <tspan fill="#111827">X</tspan> E L O
      </text>
      <!-- Stylized Red Bar on X -->
      <rect x="-35" y="-28" width="28" height="8" rx="4" fill="#E51E2B" />
      <!-- Red Dot on O. -->
      <circle cx="178" cy="-14" r="11" fill="#E51E2B" />
    </g>

    <!-- Subtitle: — I N D I A — -->
    <g transform="translate(250, 428)">
      <!-- Left Red Line -->
      <line x1="-165" y1="-5" x2="-80" y2="-5" stroke="#E51E2B" stroke-width="3.5" stroke-linecap="round" />
      <!-- Text -->
      <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="20" fill="#1F2937" letter-spacing="9" text-anchor="middle">
        INDIA
      </text>
      <!-- Right Red Line -->
      <line x1="80" y1="-5" x2="165" y2="-5" stroke="#E51E2B" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
