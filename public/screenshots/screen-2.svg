<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 710" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_filters" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F9FAFB" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333E" />
      <stop offset="100%" stop-color="#CC101C" />
    </linearGradient>
    <filter id="cardShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Device Frame Outer -->
  <rect x="8" y="8" width="384" height="694" rx="44" fill="#111827" stroke="#374151" stroke-width="4" />
  <!-- Screen Glass -->
  <rect x="18" y="18" width="364" height="674" rx="36" fill="url(#grad_filters)" />

  <!-- Status Bar -->
  <g transform="translate(36, 32)">
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1F2937">09:41</text>
    <g transform="translate(290, 2)">
      <rect x="0" y="2" width="16" height="9" rx="2" fill="none" stroke="#1F2937" stroke-width="1.5" />
      <rect x="2" y="4" width="10" height="5" rx="1" fill="#1F2937" />
      <path d="M 17 5 L 17 8" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Dynamic Island / Camera Punch Hole -->
  <rect x="150" y="26" width="100" height="20" rx="10" fill="#000000" />
  <circle cx="230" cy="36" r="4" fill="#1F2937" />

  <!-- App Header inside Mockup -->
  <g transform="translate(36, 68)">
    <!-- Mini App Icon -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#redGrad)" />
    <text x="18" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">P</text>
    
    <text x="48" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#111827">PIXELO</text>
    <text x="48" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#E51E2B">SMART TOOLS</text>

    <!-- Top Action dots -->
    <circle cx="315" cy="18" r="3" fill="#9CA3AF" />
    <circle cx="305" cy="18" r="3" fill="#9CA3AF" />
  </g>

  <!-- Showcase Canvas Card -->
  <g transform="translate(36, 120)" filter="url(#cardShad)">
    <rect x="0" y="0" width="328" height="320" rx="20" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1.5" />
    
    <!-- Red Accent Top Bar inside Card -->
    <rect x="0" y="0" width="328" height="6" rx="3" fill="url(#redGrad)" />

    <!-- Grid lines -->
    <g stroke="#F3F4F6" stroke-width="1">
      <line x1="0" y1="60" x2="328" y2="60" />
      <line x1="0" y1="120" x2="328" y2="120" />
      <line x1="0" y1="180" x2="328" y2="180" />
      <line x1="0" y1="240" x2="328" y2="240" />
      <line x1="80" y1="0" x2="80" y2="320" />
      <line x1="160" y1="0" x2="160" y2="320" />
      <line x1="240" y1="0" x2="240" y2="320" />
    </g>

    <!-- Center Art Motif -->
    <g transform="translate(164, 160)">
      <circle cx="0" cy="0" r="68" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="2" />
      <!-- Stylized P Icon Motif -->
      <path d="M -25 -40 L 15 -40 C 35 -40, 48 -28, 48 -8 C 48 12, 35 24, 15 24 L -5 24 L -5 45 L -25 45 Z" fill="url(#redGrad)" />
      <rect x="-45" y="-20" width="18" height="18" rx="4" fill="url(#redGrad)" />
      <rect x="-30" y="-2" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <rect x="-25" y="20" width="18" height="18" rx="4" fill="url(#redGrad)" />
    </g>

    <!-- Interactive floating pill tools -->
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="86" height="36" rx="18" fill="#FEE2E2" />
      <text x="43" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#B91C1C" text-anchor="middle">Auto Adjust</text>

      <rect x="96" y="0" width="92" height="36" rx="18" fill="#111827" />
      <text x="142" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">HQ Render</text>

      <rect x="198" y="0" width="90" height="36" rx="18" fill="#F3F4F6" />
      <text x="243" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#4B5563" text-anchor="middle">Split Mode</text>
    </g>
  </g>

  <!-- Lower Detail Card -->
  <g transform="translate(36, 460)">
    <rect x="0" y="0" width="328" height="180" rx="20" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1.5" />
    
    <g transform="translate(20, 28)">
      <rect x="0" y="0" width="95" height="22" rx="11" fill="#FEF2F2" />
      <text x="47" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#E51E2B" text-anchor="middle">PRO FEATURE</text>

      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#111827">Real-Time Neural Enhancements</text>
      <text x="0" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#6B7280">One-tap color grade, HDR & noise clean</text>

      <!-- Bottom action button -->
      <rect x="0" y="92" width="288" height="38" rx="12" fill="url(#redGrad)" />
      <text x="144" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">EXPLORE IN APP</text>
    </g>
  </g>
</svg>