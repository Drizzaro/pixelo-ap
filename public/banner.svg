<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#FFEAEA" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="100%" stop-color="#D91421" />
    </linearGradient>
    <linearGradient id="cardShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" rx="24" fill="url(#bannerBg)" />

  <!-- Subtle grid pattern lines in background -->
  <g opacity="0.08" stroke="#E51E2B" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
  </g>

  <!-- Decorative Red Shapes -->
  <circle cx="1100" cy="120" r="260" fill="#E51E2B" opacity="0.06" />
  <circle cx="150" cy="480" r="180" fill="#E51E2B" opacity="0.04" />
  <rect x="860" y="80" width="80" height="80" rx="20" fill="url(#redAccent)" opacity="0.15" />
  <rect x="980" y="140" width="60" height="60" rx="16" fill="url(#redAccent)" opacity="0.25" />

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#FEE2E2" stroke="#FECACA" stroke-width="1" />
    <circle cx="18" cy="18" r="5" fill="#E51E2B" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#B91C1C" letter-spacing="1">
      OFFICIAL RELEASE v2.4.1
    </text>

    <!-- Main Banner Title -->
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" fill="#111827">
      The Creative Studio
    </text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" fill="#E51E2B">
      Built For Creators.
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="18" fill="#4B5563">
      Instant photo editing, pixel precision, and seamless Android performance.
    </text>

    <!-- Features Checkmarks -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="10" fill="#E51E2B" />
        <path d="M 8 12 L 11 15 L 16 9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#1F2937">Zero Ads</text>
      </g>
      <g transform="translate(130, 0)">
        <circle cx="12" cy="12" r="10" fill="#E51E2B" />
        <path d="M 8 12 L 11 15 L 16 9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#1F2937">100% Offline Capable</text>
      </g>
      <g transform="translate(340, 0)">
        <circle cx="12" cy="12" r="10" fill="#E51E2B" />
        <path d="M 8 12 L 11 15 L 16 9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#1F2937">Ultra Lightweight</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Clean Device Showcase Mockup -->
  <g transform="translate(850, 45)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="240" height="420" rx="36" fill="#111827" stroke="#374151" stroke-width="3" />
    <!-- Screen -->
    <rect x="8" y="8" width="224" height="404" rx="30" fill="#FFFFFF" />
    
    <!-- Phone Screen UI Content -->
    <!-- App Bar -->
    <rect x="8" y="8" width="224" height="50" rx="28" fill="#FAFAFA" />
    <rect x="25" y="28" width="50" height="12" rx="6" fill="#E51E2B" />
    <circle cx="210" cy="34" r="6" fill="#E5E7EB" />
    
    <!-- Card inside phone -->
    <rect x="20" y="70" width="200" height="150" rx="16" fill="#FFF1F2" stroke="#FFE4E6" stroke-width="1.5" />
    <!-- Mini P in Phone -->
    <g transform="translate(90, 95) scale(0.35)">
      <path d="M 125 45 L 205 45 C 248 45, 275 72, 275 115 C 275 158, 248 185, 205 185 L 165 185 L 165 230 L 125 230 Z" fill="#E51E2B" />
      <rect x="70" y="80" width="46" height="46" rx="9" fill="#E51E2B" />
      <rect x="108" y="118" width="46" height="46" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" />
    </g>
    <rect x="40" y="180" width="160" height="10" rx="5" fill="#E51E2B" opacity="0.3" />
    <rect x="65" y="196" width="110" height="8" rx="4" fill="#9CA3AF" opacity="0.4" />

    <!-- Feature Grid in Phone -->
    <rect x="20" y="235" width="95" height="70" rx="12" fill="#F9FAFB" stroke="#F3F4F6" stroke-width="1" />
    <rect x="32" y="250" width="24" height="24" rx="6" fill="#E51E2B" />
    <rect x="32" y="282" width="50" height="8" rx="4" fill="#6B7280" />

    <rect x="125" y="235" width="95" height="70" rx="12" fill="#F9FAFB" stroke="#F3F4F6" stroke-width="1" />
    <rect x="137" y="250" width="24" height="24" rx="6" fill="#111827" />
    <rect x="137" y="282" width="50" height="8" rx="4" fill="#6B7280" />

    <!-- Floating Action Button in phone -->
    <rect x="35" y="335" width="170" height="38" rx="19" fill="#E51E2B" />
    <text x="120" y="359" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">
      LAUNCH STUDIO
    </text>
  </g>
</svg>
